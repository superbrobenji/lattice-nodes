name: Firmware Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Phase D: real master_pubkey_pin.h is deployer-generated + gitignored.
      # CI has no masterkey.json, so copy the committed placeholder into place
      # so the build compiles. Deployer flashes with the real header.
      - name: Stub master_pubkey_pin.h from placeholder for CI
        run: cp firmware/main/config/master_pubkey_pin.h.example firmware/main/config/master_pubkey_pin.h

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32
          path: firmware

      - name: Stub master_pubkey_pin.h from placeholder for size job
        run: |
          if [ ! -f firmware/main/config/master_pubkey_pin.h ]; then
            cp firmware/main/config/master_pubkey_pin.h.example firmware/main/config/master_pubkey_pin.h
          fi

      - name: Size report
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32
          path: firmware
          command: idf.py size

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firmware-build
          path: |
            firmware/build/*.bin
            firmware/build/size_info/
